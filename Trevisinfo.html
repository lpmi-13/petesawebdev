<title>Treviso &amp; the Veneto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Piazzolla:ital,opsz,wght@0,8..30,400..700;1,8..30,400..600&family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

<style id="page-style">
  /* ================= tokens ================= */
  :root{
    --plaster: #fdf5e9;
    --plaster-raised: #fbead2;
    --paper-card: #fffdf9;
    --ink: #241a1a;
    --ink-soft: #6b5a52;
    --rule: #f2d9ad;
    --radicchio: #e0114f;
    --radicchio-strong: #b80d40;
    --canal: #0a9f96;
    --canal-soft: rgba(10,159,150,0.14);
    --gold: #f2a30f;
    --gold-wash: rgba(242,163,15,0.18);
    --spritz: #ff7a30;
    --spritz-wash: rgba(255,122,48,0.16);
    --status-open: #1f9d55;
    --status-taken: #e0711f;
    --focus: #0a9f96;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --plaster: #171319;
      --plaster-raised: #211a22;
      --paper-card: #1d1720;
      --ink: #f5e9e2;
      --ink-soft: #c2aeb8;
      --rule: #3c2e3c;
      --radicchio: #ff5d8f;
      --radicchio-strong: #ff8ab0;
      --canal: #3ce0d1;
      --canal-soft: rgba(60,224,209,0.16);
      --gold: #ffc23c;
      --gold-wash: rgba(255,194,60,0.2);
      --spritz: #ff9153;
      --spritz-wash: rgba(255,145,83,0.2);
      --status-open: #5be08a;
      --status-taken: #ffa361;
      --focus: #3ce0d1;
    }
  }
  :root[data-theme="dark"]{
    --plaster: #171319;
    --plaster-raised: #211a22;
    --paper-card: #1d1720;
    --ink: #f5e9e2;
    --ink-soft: #c2aeb8;
    --rule: #3c2e3c;
    --radicchio: #ff5d8f;
    --radicchio-strong: #ff8ab0;
    --canal: #3ce0d1;
    --canal-soft: rgba(60,224,209,0.16);
    --gold: #ffc23c;
    --gold-wash: rgba(255,194,60,0.2);
    --spritz: #ff9153;
    --spritz-wash: rgba(255,145,83,0.2);
    --status-open: #5be08a;
    --status-taken: #ffa361;
    --focus: #3ce0d1;
  }

  *{ box-sizing:border-box; }
  html{ -webkit-text-size-adjust:100%; scroll-behavior:smooth; }
  @media (prefers-reduced-motion: reduce){ html{ scroll-behavior:auto; } *{ animation-duration:0.01ms !important; transition-duration:0.01ms !important; } }

  body{
    margin:0;
    background:var(--plaster);
    color:var(--ink);
    font-family:"Public Sans", -apple-system, "Segoe UI", sans-serif;
    font-size:16px;
    line-height:1.6;
    overflow-x:hidden;
  }
  a{ color:inherit; }
  ::selection{ background:var(--gold-wash); }
  :focus-visible{ outline:2px solid var(--focus); outline-offset:3px; }

  h1,h2,h3{
    font-family:"Piazzolla", Georgia, serif;
    font-weight:600;
    letter-spacing:-0.01em;
    text-wrap:balance;
    margin:0;
  }

  .eyebrow{
    font-family:"Space Mono", ui-monospace, monospace;
    font-size:0.7rem;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--radicchio);
  }

  .mono{ font-family:"Space Mono", ui-monospace, monospace; font-variant-numeric:tabular-nums; }

  .wrap{ max-width:1100px; margin:0 auto; padding:0 clamp(1.2rem,4vw,2.75rem); }

  [hidden]{ display:none !important; }

  /* ================= topbar ================= */
  .topbar{
    position:sticky; top:0; z-index:20;
    background:var(--plaster);
    border-bottom:1px solid var(--rule);
  }
  .topbar-inner{
    max-width:1100px; margin:0 auto;
    padding:0.95rem clamp(1.2rem,4vw,2.75rem);
    display:flex; align-items:center; justify-content:space-between; gap:1.5rem;
  }
  .brand{ display:flex; align-items:baseline; gap:0.5rem; text-decoration:none; }
  .brand .name{ font-family:"Piazzolla", serif; font-weight:700; font-size:1.28rem; }
  .brand .region{ font-family:"Space Mono", monospace; font-size:0.68rem; color:var(--ink-soft); letter-spacing:0.03em; }
  .topbar-right{ display:flex; align-items:center; gap:clamp(0.9rem,2vw,1.6rem); }
  nav.mainnav{ display:flex; gap:clamp(0.9rem,2vw,1.6rem); flex-wrap:wrap; }
  .nav-link{
    font-size:0.88rem; text-decoration:none; color:var(--ink-soft);
    padding-bottom:3px; border-bottom:2px solid transparent;
  }
  .nav-link.active, .nav-link:hover{ color:var(--ink); border-bottom-color:var(--radicchio); }
  .lang-toggle{
    display:inline-flex; align-items:center; gap:0.3rem;
    font-family:"Space Mono", monospace; font-size:0.72rem; letter-spacing:0.03em;
    background:var(--paper-card); color:var(--ink-soft); border:1px solid var(--rule);
    padding:0.35rem 0.7rem; border-radius:99px; cursor:pointer; white-space:nowrap;
  }
  .lang-toggle:hover{ border-color:var(--radicchio); color:var(--ink); }
  .lang-badge{
    display:inline-block; font-family:"Space Mono",monospace; font-size:0.62rem; letter-spacing:0.04em;
    color:var(--ink-soft); border:1px solid var(--rule); border-radius:4px; padding:0.05rem 0.32rem;
    vertical-align:middle; margin-left:0.4rem;
  }

  /* ================= section rhythm ================= */
  .page{ padding-bottom:3rem; }
  section{ padding:clamp(2.25rem,5vw,3.5rem) 0; }
  .rule-top{ border-top:1px solid var(--rule); }
  .section-head{ max-width:46ch; margin-bottom:clamp(1.75rem,4vw,2.5rem); }
  .section-head h2{ font-size:clamp(1.55rem,2.8vw,2.05rem); margin-top:0.4rem; }
  .section-head p{ color:var(--ink-soft); margin-top:0.65rem; }
  .page-head{ padding-top:clamp(2.25rem,5vw,3.5rem); }
  .page-head-row{ display:flex; justify-content:space-between; align-items:flex-end; gap:1.5rem; flex-wrap:wrap; }
  .page-head-row h2{ font-size:clamp(1.8rem,3.4vw,2.4rem); margin-top:0.5rem; }
  .page-head-row p{ color:var(--ink-soft); margin-top:0.6rem; max-width:52ch; }

  /* ================= HOME hero ================= */
  .hero{ padding-top:clamp(2.5rem,6vw,4rem); }
  .hero h1{ font-size:clamp(2.1rem,4.4vw,3.3rem); line-height:1.1; margin-top:0.6rem; max-width:16ch; }
  .hero .lede{ color:var(--ink-soft); font-size:1.06rem; max-width:56ch; margin-top:1.15rem; }

  .facts-strip{
    display:grid; grid-template-columns:repeat(4,1fr); gap:1px;
    background:var(--rule); border:1px solid var(--rule); border-radius:6px; overflow:hidden;
    margin-top:2.25rem;
  }
  @media (max-width:760px){ .facts-strip{ grid-template-columns:repeat(2,1fr); } }
  .fact{ background:var(--paper-card); padding:1.1rem 1.15rem; }
  .fact .num{ font-family:"Space Mono", monospace; font-size:1.35rem; color:var(--radicchio); }
  .fact .label{ font-size:0.78rem; color:var(--ink-soft); margin-top:0.3rem; line-height:1.4; }

  .prose{ font-size:1.02rem; max-width:64ch; }
  .prose p + p{ margin-top:1rem; }
  .prose strong{ color:var(--ink); font-weight:600; }
  .two-col{ display:grid; grid-template-columns:1fr 1fr; gap:clamp(2rem,5vw,3.5rem); }
  @media (max-width:820px){ .two-col{ grid-template-columns:1fr; } }

  .tag{
    display:inline-flex; align-items:center; gap:0.3rem;
    font-family:"Space Mono", monospace; font-size:0.68rem; letter-spacing:0.03em; text-transform:uppercase;
    padding:0.25rem 0.55rem; border-radius:99px; border:1px solid var(--rule); color:var(--ink-soft);
    background:var(--paper-card);
  }
  .tag.accent{ color:var(--radicchio); border-color:currentColor; }
  .tag.canal{ color:var(--canal); border-color:currentColor; }
  .tag.spritz{ color:var(--spritz); border-color:currentColor; }
  .tag.open{ color:var(--status-open); border-color:currentColor; }
  .tag.taken{ color:var(--status-taken); border-color:currentColor; }

  .region-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:1.25rem; }
  @media (max-width:900px){ .region-grid{ grid-template-columns:repeat(2,1fr); } }
  @media (max-width:560px){ .region-grid{ grid-template-columns:1fr; } }
  .region-card{
    background:var(--paper-card); border:1px solid var(--rule); border-radius:10px; overflow:hidden;
    display:flex; flex-direction:column; box-shadow:0 2px 10px rgba(224,17,79,0.06);
  }
  .region-scene{ display:block; width:100%; height:auto; line-height:0; }
  .region-scene svg{ display:block; width:100%; height:auto; }
  .region-card .region-body{ padding:1.15rem 1.3rem 1.3rem; }
  .region-card h3{ font-size:1.05rem; margin-bottom:0.5rem; }
  .region-card p{ color:var(--ink-soft); font-size:0.9rem; margin:0; }
  .region-card .dist{ margin-top:0.75rem; font-family:"Space Mono",monospace; font-size:0.72rem; color:var(--canal); font-weight:700; }

  /* ================= picture gallery ================= */
  .gallery-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:1.25rem; }
  @media (max-width:820px){ .gallery-grid{ grid-template-columns:repeat(2,1fr); } }
  @media (max-width:480px){ .gallery-grid{ grid-template-columns:1fr; } }
  .gallery-item{ margin:0; background:var(--paper-card); border:1px solid var(--rule); border-radius:10px; overflow:hidden; box-shadow:0 2px 10px rgba(224,17,79,0.06); }
  .gallery-pic{ display:block; width:100%; height:auto; line-height:0; }
  .gallery-pic svg{ display:block; width:100%; height:auto; }
  .gallery-item figcaption{ padding:0.85rem 1.05rem 1.05rem; font-size:0.86rem; color:var(--ink-soft); }
  .gallery-item figcaption b{ display:block; font-family:"Piazzolla",serif; font-weight:600; font-size:1rem; color:var(--ink); margin-bottom:0.2rem; }

  .hub-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:1.25rem; }
  @media (max-width:900px){ .hub-grid{ grid-template-columns:repeat(2,1fr); } }
  @media (max-width:560px){ .hub-grid{ grid-template-columns:1fr; } }
  .hub-card{
    display:block; text-decoration:none; color:var(--ink);
    background:var(--paper-card); border:1px solid var(--rule); border-radius:8px;
    padding:1.5rem 1.4rem; transition:border-color .15s ease, transform .15s ease, box-shadow .15s ease;
    box-shadow:0 2px 10px rgba(224,17,79,0.06);
  }
  .hub-card:hover{ box-shadow:0 6px 18px rgba(224,17,79,0.14); }
  .hub-card:hover{ border-color:var(--radicchio); transform:translateY(-2px); }
  .hub-card .glyph{ font-family:"Piazzolla",serif; font-style:italic; font-size:1.7rem; color:var(--radicchio); }
  .hub-card h3{ font-size:1.05rem; margin-top:0.7rem; }
  .hub-card p{ font-size:0.86rem; color:var(--ink-soft); margin-top:0.4rem; }
  .hub-card .go{ display:inline-block; margin-top:0.9rem; font-family:"Space Mono",monospace; font-size:0.72rem; letter-spacing:0.04em; text-transform:uppercase; color:var(--canal); }

  /* ================= banners &amp; icons ================= */
  .page-banner{
    display:block; width:100%; height:auto;
    border:1px solid var(--rule); border-radius:8px; overflow:hidden;
    background:var(--paper-card);
  }
  .page-banner svg{ display:block; width:100%; height:auto; }
  .hero .page-banner{ margin-bottom:2rem; }
  .page-head .page-banner{ margin-top:1.75rem; }
  .region-card .icon{ width:42px; height:42px; margin-bottom:0.85rem; display:block; }

  /* ================= search ================= */
  .search-row{ margin-bottom:1rem; max-width:380px; }
  .search-row .field{ width:100%; }

  /* ================= filter bar ================= */
  .filter-bar{ display:flex; gap:0.55rem; flex-wrap:wrap; margin-bottom:1.75rem; }
  .filter-bar button{
    font-family:"Space Mono", monospace; font-size:0.74rem; letter-spacing:0.02em;
    background:var(--paper-card); color:var(--ink-soft); border:1px solid var(--rule);
    padding:0.45rem 0.85rem; border-radius:99px; cursor:pointer;
  }
  .filter-bar button.active{ color:var(--plaster); background:var(--radicchio); border-color:var(--radicchio); }
  .filter-bar button:hover:not(.active){ border-color:var(--radicchio); color:var(--ink); }

  /* ================= events ================= */
  .events-list{ display:flex; flex-direction:column; gap:1rem; }
  .event-card{
    display:grid; grid-template-columns:5.5rem 1fr auto; gap:1.3rem; align-items:center;
    background:var(--paper-card); border:1px solid var(--rule); border-radius:8px; padding:1.1rem 1.3rem;
    box-shadow:0 2px 10px rgba(224,17,79,0.06);
  }
  @media (max-width:680px){ .event-card{ grid-template-columns:4.2rem 1fr; } .event-card .event-tag-col{ grid-column:1 / -1; margin-top:0.6rem; } }
  .date-block{
    text-align:center; background:var(--plaster-raised); border:1px solid var(--rule); border-radius:6px;
    padding:0.55rem 0.3rem;
  }
  .date-block .mon{ font-family:"Space Mono",monospace; font-size:0.66rem; letter-spacing:0.06em; text-transform:uppercase; color:var(--radicchio); }
  .date-block .day{ font-family:"Piazzolla",serif; font-weight:700; font-size:1.5rem; line-height:1.1; }
  .event-card h3{ font-size:1.05rem; }
  .event-card .meta{ font-size:0.84rem; color:var(--ink-soft); margin-top:0.3rem; }
  .event-card .desc{ font-size:0.9rem; color:var(--ink-soft); margin-top:0.45rem; max-width:52ch; }

  /* ================= listing cards (stay / marketplace) ================= */
  .card-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:1.25rem; }
  @media (max-width:900px){ .card-grid{ grid-template-columns:repeat(2,1fr); } }
  @media (max-width:620px){ .card-grid{ grid-template-columns:1fr; } }
  .listing, .pending-card{
    background:var(--paper-card); border:1px solid var(--rule); border-radius:8px; padding:1.3rem 1.3rem 1.4rem;
    display:flex; flex-direction:column; gap:0.7rem; box-shadow:0 2px 10px rgba(224,17,79,0.06);
  }
  .listing-photo{
    position:relative; margin:-1.3rem -1.3rem 0; aspect-ratio:4/3; overflow:hidden;
    border-radius:8px 8px 0 0; background:var(--plaster-raised);
  }
  .listing-photo img{ display:block; width:100%; height:100%; object-fit:cover; }
  .listing-photo .photo-count{
    position:absolute; top:0.5rem; right:0.5rem; background:rgba(20,10,15,0.6); color:#fff;
    font-family:"Space Mono",monospace; font-size:0.68rem; letter-spacing:0.02em;
    padding:0.2rem 0.5rem; border-radius:99px;
  }
  .listing-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:0.75rem; }
  .listing h3, .pending-card h3{ font-size:1.02rem; line-height:1.3; }
  .price{ font-family:"Space Mono",monospace; font-weight:700; color:var(--radicchio); white-space:nowrap; font-size:0.95rem; }
  .listing .loc, .pending-card .loc{ font-size:0.82rem; color:var(--canal); }
  .listing .desc, .pending-card .desc{ font-size:0.88rem; color:var(--ink-soft); }
  .listing .amenities, .pending-card .amenities{ font-size:0.78rem; color:var(--ink-soft); border-top:1px dashed var(--rule); padding-top:0.6rem; margin-top:0.15rem; }
  .listing-foot{ display:flex; justify-content:space-between; align-items:center; margin-top:auto; padding-top:0.5rem; gap:0.75rem; flex-wrap:wrap; }
  .host{ font-size:0.78rem; color:var(--ink-soft); }

  /* ================= reviews ================= */
  .reviews-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:1.25rem; }
  @media (max-width:760px){ .reviews-grid{ grid-template-columns:1fr; } }
  .review{
    background:var(--paper-card); border:1px solid var(--rule); border-radius:8px; padding:1.4rem 1.4rem;
    box-shadow:0 2px 10px rgba(224,17,79,0.06);
  }
  .stars{ color:var(--gold); font-size:0.95rem; letter-spacing:0.1em; }
  .review h3{ font-size:1.02rem; margin-top:0.55rem; }
  .review p.body{ font-size:0.92rem; color:var(--ink-soft); margin-top:0.55rem; }
  .review .byline{ font-family:"Space Mono",monospace; font-size:0.72rem; color:var(--ink-soft); margin-top:0.85rem; padding-top:0.7rem; border-top:1px dashed var(--rule); }
  .review .byline b{ color:var(--ink); font-weight:600; }
  .review-photos{ display:flex; gap:0.5rem; flex-wrap:wrap; margin-top:0.85rem; }
  .review-photos img{
    width:66px; height:66px; object-fit:cover; border-radius:6px; border:1px solid var(--rule); display:block;
  }

  /* ================= photo picker (forms) ================= */
  .photo-picker input[type="file"]{
    font-family:"Public Sans", sans-serif; font-size:0.86rem; color:var(--ink-soft);
  }
  .photo-thumbs{ display:flex; gap:0.6rem; flex-wrap:wrap; }
  .photo-thumb{
    position:relative; width:74px; height:74px; border-radius:6px; overflow:hidden; border:1px solid var(--rule);
    background:var(--plaster-raised);
  }
  .photo-thumb img{ display:block; width:100%; height:100%; object-fit:cover; }
  .photo-remove{
    position:absolute; top:2px; right:2px; width:19px; height:19px; border-radius:50%; border:none;
    background:rgba(20,10,15,0.65); color:#fff; font-size:0.78rem; line-height:1; cursor:pointer;
    display:flex; align-items:center; justify-content:center; padding:0;
  }
  .photo-remove:hover{ background:rgba(20,10,15,0.85); }

  /* ================= forms ================= */
  .form-card{
    background:var(--paper-card); border:1px solid var(--rule); border-radius:8px;
    padding:clamp(1.5rem,4vw,2.25rem); max-width:44rem;
    display:flex; flex-direction:column; gap:1.1rem;
  }
  .form-row{ display:grid; grid-template-columns:1fr 1fr; gap:1.1rem; }
  @media (max-width:560px){ .form-row{ grid-template-columns:1fr; } }
  .field-group{ display:flex; flex-direction:column; gap:0.4rem; }
  .field-group label{ font-family:"Space Mono",monospace; font-size:0.72rem; letter-spacing:0.03em; text-transform:uppercase; color:var(--ink-soft); }
  .lang-radio{ display:flex; gap:1.25rem; margin-top:0.35rem; }
  .lang-radio label{ font-family:"Public Sans",sans-serif; font-size:0.9rem; text-transform:none; letter-spacing:normal; color:var(--ink); display:flex; align-items:center; gap:0.4rem; cursor:pointer; }
  .lang-radio input{ accent-color:var(--radicchio); }
  .field, select.field, textarea.field{
    font-family:"Public Sans", sans-serif;
    font-size:0.95rem;
    padding:0.7rem 0.85rem;
    border:1px solid var(--rule);
    background:var(--plaster-raised);
    color:var(--ink);
    border-radius:4px;
    width:100%;
  }
  textarea.field{ resize:vertical; min-height:5.5rem; font-family:"Public Sans",sans-serif; }
  .field::placeholder{ color:var(--ink-soft); }
  .form-actions{ display:flex; align-items:center; gap:1rem; }
  .btn{
    font-family:"Space Mono", monospace;
    font-size:0.82rem;
    letter-spacing:0.03em;
    background:var(--radicchio);
    color:var(--plaster);
    border:1px solid var(--radicchio);
    padding:0.75rem 1.3rem;
    border-radius:4px;
    cursor:pointer;
    transition:background 0.15s ease;
    white-space:nowrap;
  }
  .btn:hover:not(:disabled){ background:var(--radicchio-strong); }
  .btn:disabled{ opacity:0.55; cursor:default; }
  .btn.ghost{ background:transparent; color:var(--ink-soft); border-color:var(--rule); }
  .btn.ghost:hover:not(:disabled){ background:var(--plaster-raised); color:var(--ink); border-color:var(--ink-soft); }
  .btn.small{ padding:0.5rem 0.9rem; font-size:0.74rem; }
  .fineprint{ font-family:"Space Mono",monospace; font-size:0.72rem; color:var(--ink-soft); }

  .notice{
    border-radius:6px; padding:0.85rem 1rem; font-size:0.88rem; margin-bottom:1.25rem;
    border:1px solid var(--rule); background:var(--plaster-raised); color:var(--ink-soft);
  }
  .notice.success{ border-color:var(--status-open); color:var(--status-open); background:var(--canal-soft); }
  .notice.error{ border-color:var(--radicchio); color:var(--radicchio); }

  .muted-note{ color:var(--ink-soft); font-size:0.9rem; }

  footer{
    border-top:1px solid var(--rule);
    padding:2rem clamp(1.2rem,4vw,2.75rem) 2.5rem;
    max-width:1100px; margin:0 auto;
    display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:0.75rem;
  }
  footer .brandline{ font-family:"Piazzolla",serif; font-weight:600; }
  footer .note{ font-family:"Space Mono",monospace; font-size:0.7rem; color:var(--ink-soft); max-width:34ch; }
  footer .admin-link{ font-family:"Space Mono",monospace; font-size:0.7rem; color:var(--ink-soft); text-decoration:underline; margin-top:0.5rem; display:inline-block; }
</style>

<div id="app"></div>

<script>
(function(){
  var SCRIPT_SOURCE = document.currentScript.textContent;

  /* ================= language (EN / IT) ================= */
  var LANG = (function(){

  var EVENT_TAG_CLASS = { markets:'accent', food:'canal', music:'spritz', culture:'' };
  var EVENT_EXPIRE_DAYS = 21;

  function eventDateLocale(){ return LANG === 'it' ? 'it-IT' : 'en-GB'; }
  function formatEventMonthDay(dateStr){
    var d = new Date(dateStr + 'T00:00:00');
    if (isNaN(d.getTime())) return { mon:'', day:'' };
    var mon = d.toLocaleDateString(eventDateLocale(), { month:'short' }).replace('.', '').toUpperCase();
    return { mon: mon, day: String(d.getDate()) };
  }
  function formatEventRange(startDate, endDate){
    var d1 = new Date(startDate + 'T00:00:00');
    if (isNaN(d1.getTime())) return '';
    var opts = { day:'numeric', month:'short' };
    if (!endDate || endDate === startDate) return d1.toLocaleDateString(eventDateLocale(), opts);
    var d2 = new Date(endDate + 'T00:00:00');
    if (isNaN(d2.getTime())) return d1.toLocaleDateString(eventDateLocale(), opts);
    if (d1.getMonth() === d2.getMonth() && d1.getFullYear() === d2.getFullYear()){
      return d1.getDate() + '–' + d2.toLocaleDateString(eventDateLocale(), opts);
    }
    return d1.toLocaleDateString(eventDateLocale(), opts) + ' – ' + d2.toLocaleDateString(eventDateLocale(), opts);
  }
  function isEventExpired(ev){
    var end = ev.endDate || ev.startDate;
    if (!end) return false;
    var endMs = new Date(end + 'T23:59:59').getTime();
    if (isNaN(endMs)) return false;
    return (Date.now() - endMs) > EVENT_EXPIRE_DAYS * 24 * 60 * 60 * 1000;
  }
  function visibleEvents(list){
    return list.filter(function(ev){ return !isEventExpired(ev); })
      .slice().sort(function(a, b){ return (a.startDate || '').localeCompare(b.startDate || ''); });
  }

      var md = formatEventMonthDay(ev.startDate);

  /* ---------- routing ---------- */
  function route(){
    var hash = (location.hash || '#home').slice(1);
    var pages = document.querySelectorAll('.page');
    var found = false;
    pages.forEach(function(p){
      var match = p.id === hash;
      p.hidden = !match;
      if (match) found = true;
    });
    if (!found) { document.getElementById('home').hidden = false; hash = 'home'; }
    document.querySelectorAll('.nav-link').forEach(function(a){
      a.classList.toggle('active', a.getAttribute('href') === '#' + hash);
    });
    window.scrollTo(0,0);
  }
  window.addEventListener('hashchange', route);

  /* ---------- filters ---------- */
  /* ---------- category filters + keyword search (combined, per page) ---------- */
  function wireListControls(pageId){
    var page = document.getElementById(pageId);
    if (!page) return;
    var bar = page.querySelector('.filter-bar');
    var search = page.querySelector('.search-row input[type="search"]');
    var list = page.querySelector('.events-list, .card-grid');
    var emptyMsg = page.querySelector('[data-search-empty]');
    if (!list) return;
    function apply(){
      var activeBtn = bar ? bar.querySelector('button.active') : null;
      var cat = activeBtn ? activeBtn.dataset.filter : 'all';
      var q = search ? search.value.trim().toLowerCase() : '';
      var total = 0, visible = 0;
      list.querySelectorAll('[data-cat]').forEach(function(card){
        total++;
        var matchCat = (cat === 'all' || card.dataset.cat === cat);
        var matchSearch = !q || (card.dataset.search || '').indexOf(q) !== -1;
        var show = matchCat && matchSearch;
        card.style.display = show ? '' : 'none';
        if (show) visible++;
      });
      if (emptyMsg) emptyMsg.hidden = !(total > 0 && visible === 0);
    }
    if (bar) {
      bar.addEventListener('click', function(e){
        var btn = e.target.closest('button[data-filter]');
        if (!btn) return;
        bar.querySelectorAll('button').forEach(function(b){ b.classList.toggle('active', b === btn); });
        apply();
      });
    }
    if (search) search.addEventListener('input', apply);
    apply();
  }
  function wireFilters(){
    ['events', 'stay', 'marketplace'].forEach(wireListControls);
  }

  /* ---------- language toggle ---------- */
  function wireLangToggle(){
    var btn = document.getElementById('lang-toggle-btn');
    if (!btn) return;
    btn.addEventListener('click', function(){
      LANG = (LANG === 'en') ? 'it' : 'en';
      try { localStorage.setItem('treviso_lang', LANG); } catch (e) {}
      renderApp();
    });
  }

  /* ---------- success banner after a reload that followed a submission ---------- */
  function showSuccessBannerIfNeeded(){
    try {
      var justSubmitted = sessionStorage.getItem('justSubmitted');
      if (justSubmitted) {
        sessionStorage.removeItem('justSubmitted');
        var noticeIdByKind = { sell:'sell-notice', list:'list-notice', review:'review-notice', event:'event-notice' };
        var target = document.getElementById(noticeIdByKind[justSubmitted] || 'list-notice');
        if (target) target.innerHTML = '<div class="notice success">' + t('notice_submitted') + '</div>';
      }
    } catch (e) {}
  }

  /* ---------- publishing (artifact capability) ---------- */
  function buildFullDocument(state){
    var json = JSON.stringify(state).replace(/</g, '\\u003c');
    var newScript = SCRIPT_SOURCE.replace(
      /\/\*STATE_START\*\/[\s\S]*?\/\*STATE_END\*\//,
      '/*STATE_START*/\n  var STATE = ' + json + ';\n  /*STATE_END*/'
    );
    var headLinks = Array.prototype.map.call(
      document.querySelectorAll('link[rel="preconnect"], link[rel="stylesheet"]'),
      function(l){ return l.outerHTML; }
    ).join('');
    var css = document.getElementById('page-style').textContent;
    var head = '<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">' +
      '<title>' + escapeHtml(document.title) + '</title>' + headLinks +
      '<style id="page-style">' + css + '</style>';
    return '<!doctype html><html><head>' + head + '</head><body><div id="app"></div><script>' + newScript + '<' + '/script></body></html>';
  }

  function showNotice(container, kind, msg){
    if (!container) return;
    container.innerHTML = '<div class="notice ' + kind + '">' + msg + '</div>';
  }

  function readOnlyMessage(){
    return t('notice_readonly');
  }

  function publish(newState){
    if (!window.claude || !window.claude.use) return Promise.reject({ code: 'not_granted' });
    return window.claude.use('artifact').then(function(a){
      if (!a) { var err = new Error('artifact capability unavailable'); err.code = 'not_granted'; throw err; }
      return a.publish(buildFullDocument(newState));
    });
  }

  function cloneState(){ return JSON.parse(JSON.stringify(STATE)); }

  /* ---------- photo picker: read, downscale, and compress images client-side ---------- */
  var PHOTO_MAX_IMAGES = 3, PHOTO_MAX_DIM = 1000, PHOTO_QUALITY = 0.72, PHOTO_MAX_SOURCE_BYTES = 15 * 1024 * 1024;

  function readFileAsDataURL(file){
    return new Promise(function(resolve, reject){
      var reader = new FileReader();
      reader.onload = function(){ resolve(reader.result); };
      reader.onerror = function(){ reject(reader.error || new Error('read_failed')); };
      reader.readAsDataURL(file);
    });
  }

  function resizeImageDataURL(dataUrl, maxDim, quality){
    return new Promise(function(resolve, reject){
      var img = new Image();
      img.onload = function(){
        var w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
        var scale = Math.min(1, maxDim / Math.max(w, h));
        var cw = Math.max(1, Math.round(w * scale)), ch = Math.max(1, Math.round(h * scale));
        var canvas = document.createElement('canvas');
        canvas.width = cw; canvas.height = ch;
        var ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, cw, ch);
        try { resolve(canvas.toDataURL('image/jpeg', quality)); }
        catch (err) { reject(err); }
      };
      img.onerror = function(){ reject(new Error('decode_failed')); };
      img.src = dataUrl;
    });
  }

  function makePhotoPicker(inputId, previewId){
    var input = document.getElementById(inputId);
    var preview = document.getElementById(previewId);
    var images = [];
    function renderPreview(){
      if (!preview) return;
      preview.innerHTML = images.map(function(src, i){
        return '<div class="photo-thumb"><img src="' + src + '" alt=""><button type="button" class="photo-remove" data-i="' + i + '" aria-label="Remove photo">&times;</button></div>';
      }).join('');
    }
    if (!input) return { getImages: function(){ return images; }, reset: function(){ images = []; renderPreview(); } };
    if (preview) {
      preview.addEventListener('click', function(e){
        var btn = e.target.closest('.photo-remove');
        if (!btn) return;
        images.splice(Number(btn.dataset.i), 1);
        renderPreview();
      });
    }
    input.addEventListener('change', function(){
      var picked = Array.prototype.slice.call(input.files || []);
      input.value = '';
      var room = Math.max(0, PHOTO_MAX_IMAGES - images.length);
      var files = picked.slice(0, room);
      (function next(idx){
        if (idx >= files.length) return;
        var file = files[idx];
        if (!file.type || file.type.indexOf('image/') !== 0 || file.size > PHOTO_MAX_SOURCE_BYTES) { next(idx + 1); return; }
        readFileAsDataURL(file)
          .then(function(raw){ return resizeImageDataURL(raw, PHOTO_MAX_DIM, PHOTO_QUALITY); })
          .then(function(small){
            if (images.length < PHOTO_MAX_IMAGES) images.push(small);
            renderPreview();
            next(idx + 1);
          })
          .catch(function(){ next(idx + 1); });
      })(0);
    });
    return { getImages: function(){ return images; }, reset: function(){ images = []; renderPreview(); } };
  }

  var PHOTO_PICKERS = { sell: null, review: null };
  function wirePhotoPickers(){
    PHOTO_PICKERS.sell = makePhotoPicker('sell-photos-input', 'sell-photos-preview');
    PHOTO_PICKERS.review = makePhotoPicker('review-photos-input', 'review-photos-preview');
  }

  function wireForm(formId, noticeId, kind){
    var form = document.getElementById(formId);
    if (!form) return;
    var notice = document.getElementById(noticeId);
    form.addEventListener('submit', function(e){
      e.preventDefault();
      var btn = form.querySelector('button[type="submit"]');
      var fd = new FormData(form);
      var newState = cloneState();
      var idPrefix = { sell:'p', list:'a', review:'r', event:'e' }[kind] || 'x';
      var id = idPrefix + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
      var submittedAt = new Date().toISOString().slice(0,10);
      var picker = PHOTO_PICKERS[kind];
      var images = picker ? picker.getImages().slice() : [];
      var contentLang = fd.get('lang') || LANG;
      if (kind === 'sell') {
        newState.pendingMarketplace.push({
          id: id, title: fd.get('title'), price: fd.get('price'), category: fd.get('category'),
          condition: fd.get('condition'), location: fd.get('location'), desc: fd.get('desc'),
          sellerName: fd.get('sellerName'), contact: fd.get('contact'), submittedAt: submittedAt,
          images: images, lang: contentLang
        });
      } else if (kind === 'list') {
        newState.pendingStay.push({
          id: id, title: fd.get('title'), price: fd.get('price'), type: fd.get('type'),
          location: fd.get('location'), desc: fd.get('desc'), amenities: fd.get('amenities'),
          hostName: fd.get('hostName'), contact: fd.get('contact'), submittedAt: submittedAt
        });
      } else if (kind === 'review') {
        newState.pendingReviews.push({
          id: id, title: fd.get('title'), rating: fd.get('rating'), body: fd.get('body'),
          name: fd.get('name'), byline: fd.get('byline'), contact: fd.get('contact'), submittedAt: submittedAt,
          images: images, lang: contentLang
        });
      } else if (kind === 'event') {
        var startDate = fd.get('startDate');
        newState.pendingEvents.push({
          id: id, title: fd.get('title'), cat: fd.get('cat'), startDate: startDate,
          endDate: fd.get('endDate') || startDate, location: fd.get('location'), desc: fd.get('desc'),
          submitterName: fd.get('submitterName'), contact: fd.get('contact'), submittedAt: submittedAt,
          lang: contentLang
        });
      }
      btn.disabled = true; btn.textContent = t('btn_submitting');
      showNotice(notice, '', '');
      notice.innerHTML = '';
      try { sessionStorage.setItem('justSubmitted', kind); } catch (err) {}
      function attempt(retried){
        publish(newState).catch(function(err){
          var code = err && err.code;
          try { sessionStorage.removeItem('justSubmitted'); } catch (e2) {}
          if (code === 'not_writer' || code === 'not_granted' || code === 'consent_required' || code === 'not_declared' || code === 'capability_disabled') {
            btn.disabled = true;
            showNotice(notice, 'error', readOnlyMessage());
          } else if (code === 'conflict') {
            /* another version is already publishing in; the view reloads on its own */
          } else if (code === 'upstream_error' && !retried) {
            setTimeout(function(){ attempt(true); }, 800 + Math.random() * 700);
          } else {
            btn.disabled = false; btn.textContent = t('btn_submit_review');
            showNotice(notice, 'error', t('notice_error_generic'));
          }
        });
      }
      attempt(false);
    });
  }
  var ADMIN_KEYS = {
    marketplace: { pend:'pendingMarketplace', live:'marketplace' },
    stay: { pend:'pendingStay', live:'stay' },
    reviews: { pend:'pendingReviews', live:'reviews' },
    events: { pend:'pendingEvents', live:'events' }
  };
  function wireAdmin(containerId, kind){
    var container = document.getElementById(containerId);
    if (!container) return;
    container.addEventListener('click', function(e){
      var btn = e.target.closest('button[data-action]');
      if (!btn) return;
      var id = btn.dataset.id;
      var action = btn.dataset.action;
      var keys = ADMIN_KEYS[kind];
      var pendKey = keys.pend, liveKey = keys.live;
      var newState = cloneState();
      var idx = newState[pendKey].findIndex(function(x){ return x.id === id; });
      if (idx === -1) return;
      var entry = newState[pendKey].splice(idx, 1)[0];
      if (action === 'approve') {
        if (kind === 'marketplace' || kind === 'stay') {
          entry.badgeKind = 'open';
          delete entry.badgeText;
          if (kind === 'marketplace') entry.postedAt = new Date().toISOString().slice(0,10);
        }
        newState[liveKey].push(entry);
      }
      var card = btn.closest('.pending-card');
      var buttons = card.querySelectorAll('button');
      buttons.forEach(function(b){ b.disabled = true; });
      var adminNotice = document.getElementById('admin-notice');
      publish(newState).catch(function(err){
        var code = err && err.code;
        buttons.forEach(function(b){ b.disabled = false; });
        if (code === 'not_writer' || code === 'not_granted' || code === 'consent_required' || code === 'not_declared' || code === 'capability_disabled') {
          showNotice(adminNotice, 'error', readOnlyMessage());
        } else if (code === 'conflict') {
          /* view reloads to the winning version on its own */
        } else {
          showNotice(adminNotice, 'error', t('notice_error_admin'));
        }
      });
    });
  }
  /* ---------- render + wire the whole app (re-run on language toggle) ---------- */
  function wireApp(){
    wireFilters();
    wirePhotoPickers();
    wireForm('sell-form', 'sell-notice', 'sell');
    wireForm('list-form', 'list-notice', 'list');
    wireForm('review-form', 'review-notice', 'review');
    wireForm('event-form', 'event-notice', 'event');
    wireAdmin('admin-marketplace', 'marketplace');
    wireAdmin('admin-stay', 'stay');
    wireAdmin('admin-reviews', 'reviews');
    wireAdmin('admin-events', 'events');
    wireLangToggle();
  }

  function renderApp(){
    document.title = t('site_title');
    document.getElementById('app').innerHTML = renderBody(STATE);
    route();
    wireApp();
  }

  renderApp();
  showSuccessBannerIfNeeded();
})();
</script>
