<title>Treviso &amp; the Veneto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Piazzolla:ital,opsz,wght@0,8..30,400..700;1,8..30,400..600&family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

<style id="page-style">
  /* ================= tokens ================= */
  :root{
    --plaster: #e7e9e1;
    --plaster-raised: #dee1d6;
    --paper-card: #f2f3ee;
    --ink: #221f1a;
    --ink-soft: #5c5a4d;
    --rule: #cac8b7;
    --radicchio: #8c1f3f;
    --radicchio-strong: #6e1830;
    --canal: #3c6b6e;
    --canal-soft: rgba(60,107,110,0.13);
    --gold: #a97f2f;
    --gold-wash: rgba(169,127,47,0.16);
    --status-open: #43683f;
    --status-taken: #8a5c46;
    --focus: #2c5c66;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --plaster: #14150f;
      --plaster-raised: #1d1f16;
      --paper-card: #191b13;
      --ink: #ece7d9;
      --ink-soft: #b3ae9a;
      --rule: #35362a;
      --radicchio: #dd7592;
      --radicchio-strong: #e8899f;
      --canal: #74ab9f;
      --canal-soft: rgba(116,171,159,0.16);
      --gold: #d9b36b;
      --gold-wash: rgba(217,179,107,0.18);
      --status-open: #86bd80;
      --status-taken: #cf9a84;
      --focus: #86c3cd;
    }
  }
  :root[data-theme="dark"]{
    --plaster: #14150f;
    --plaster-raised: #1d1f16;
    --paper-card: #191b13;
    --ink: #ece7d9;
    --ink-soft: #b3ae9a;
    --rule: #35362a;
    --radicchio: #dd7592;
    --radicchio-strong: #e8899f;
    --canal: #74ab9f;
    --canal-soft: rgba(116,171,159,0.16);
    --gold: #d9b36b;
    --gold-wash: rgba(217,179,107,0.18);
    --status-open: #86bd80;
    --status-taken: #cf9a84;
    --focus: #86c3cd;
  }

  *{ box-sizing:border-box; }
  html{ -webkit-text-size-adjust:100%; scroll-behavior:smooth; }
  @media (prefers-reduced-motion: reduce){ html{ scroll-behavior:auto; } *{ animation-duration:0.01ms !important; transition-duration:0.01ms !important; } }

  body{
    margin:0;
    background:var(--plaster);
    color:var(--ink);
    font-family:"Public Sans", -apple-system, "Segoe UI", sans-serif;
    font-size:16px;
    line-height:1.6;
    overflow-x:hidden;
  }
  a{ color:inherit; }
  ::selection{ background:var(--gold-wash); }
  :focus-visible{ outline:2px solid var(--focus); outline-offset:3px; }

  h1,h2,h3{
    font-family:"Piazzolla", Georgia, serif;
    font-weight:600;
    letter-spacing:-0.01em;
    text-wrap:balance;
    margin:0;
  }

  .eyebrow{
    font-family:"Space Mono", ui-monospace, monospace;
    font-size:0.7rem;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--radicchio);
  }

  .mono{ font-family:"Space Mono", ui-monospace, monospace; font-variant-numeric:tabular-nums; }

  .wrap{ max-width:1100px; margin:0 auto; padding:0 clamp(1.2rem,4vw,2.75rem); }

  [hidden]{ display:none !important; }

  /* ================= topbar ================= */
  .topbar{
    position:sticky; top:0; z-index:20;
    background:var(--plaster);
    border-bottom:1px solid var(--rule);
  }
  .topbar-inner{
    max-width:1100px; margin:0 auto;
    padding:0.95rem clamp(1.2rem,4vw,2.75rem);
    display:flex; align-items:center; justify-content:space-between; gap:1.5rem;
  }
  .brand{ display:flex; align-items:baseline; gap:0.5rem; text-decoration:none; }
  .brand .name{ font-family:"Piazzolla", serif; font-weight:700; font-size:1.28rem; }
  .brand .region{ font-family:"Space Mono", monospace; font-size:0.68rem; color:var(--ink-soft); letter-spacing:0.03em; }
  nav.mainnav{ display:flex; gap:clamp(0.9rem,2vw,1.6rem); flex-wrap:wrap; }
  .nav-link{
    font-size:0.88rem; text-decoration:none; color:var(--ink-soft);
    padding-bottom:3px; border-bottom:2px solid transparent;
  }
  .nav-link.active, .nav-link:hover{ color:var(--ink); border-bottom-color:var(--radicchio); }

  /* ================= section rhythm ================= */
  .page{ padding-bottom:3rem; }
  section{ padding:clamp(2.25rem,5vw,3.5rem) 0; }
  .rule-top{ border-top:1px solid var(--rule); }
  .section-head{ max-width:46ch; margin-bottom:clamp(1.75rem,4vw,2.5rem); }
  .section-head h2{ font-size:clamp(1.55rem,2.8vw,2.05rem); margin-top:0.4rem; }
  .section-head p{ color:var(--ink-soft); margin-top:0.65rem; }
  .page-head{ padding-top:clamp(2.25rem,5vw,3.5rem); }
  .page-head-row{ display:flex; justify-content:space-between; align-items:flex-end; gap:1.5rem; flex-wrap:wrap; }
  .page-head-row h2{ font-size:clamp(1.8rem,3.4vw,2.4rem); margin-top:0.5rem; }
  .page-head-row p{ color:var(--ink-soft); margin-top:0.6rem; max-width:52ch; }

  /* ================= HOME hero ================= */
  .hero{ padding-top:clamp(2.5rem,6vw,4rem); }
  .hero h1{ font-size:clamp(2.1rem,4.4vw,3.3rem); line-height:1.1; margin-top:0.6rem; max-width:16ch; }
  .hero .lede{ color:var(--ink-soft); font-size:1.06rem; max-width:56ch; margin-top:1.15rem; }

  .facts-strip{
    display:grid; grid-template-columns:repeat(4,1fr); gap:1px;
    background:var(--rule); border:1px solid var(--rule); border-radius:6px; overflow:hidden;
    margin-top:2.25rem;
  }
  @media (max-width:760px){ .facts-strip{ grid-template-columns:repeat(2,1fr); } }
  .fact{ background:var(--paper-card); padding:1.1rem 1.15rem; }
  .fact .num{ font-family:"Space Mono", monospace; font-size:1.35rem; color:var(--radicchio); }
  .fact .label{ font-size:0.78rem; color:var(--ink-soft); margin-top:0.3rem; line-height:1.4; }

  .prose{ font-size:1.02rem; max-width:64ch; }
  .prose p + p{ margin-top:1rem; }
  .prose strong{ color:var(--ink); font-weight:600; }
  .two-col{ display:grid; grid-template-columns:1fr 1fr; gap:clamp(2rem,5vw,3.5rem); }
  @media (max-width:820px){ .two-col{ grid-template-columns:1fr; } }

  .tag{
    display:inline-flex; align-items:center; gap:0.3rem;
    font-family:"Space Mono", monospace; font-size:0.68rem; letter-spacing:0.03em; text-transform:uppercase;
    padding:0.25rem 0.55rem; border-radius:99px; border:1px solid var(--rule); color:var(--ink-soft);
    background:var(--paper-card);
  }
  .tag.accent{ color:var(--radicchio); border-color:currentColor; }
  .tag.canal{ color:var(--canal); border-color:currentColor; }
  .tag.open{ color:var(--status-open); border-color:currentColor; }
  .tag.taken{ color:var(--status-taken); border-color:currentColor; }

  .region-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:1.25rem; }
  @media (max-width:900px){ .region-grid{ grid-template-columns:repeat(2,1fr); } }
  @media (max-width:560px){ .region-grid{ grid-template-columns:1fr; } }
  .region-card{ background:var(--paper-card); border:1px solid var(--rule); border-radius:8px; padding:1.25rem 1.3rem; }
  .region-card h3{ font-size:1.05rem; margin-bottom:0.5rem; }
  .region-card p{ color:var(--ink-soft); font-size:0.9rem; margin:0; }
  .region-card .dist{ margin-top:0.75rem; font-family:"Space Mono",monospace; font-size:0.72rem; color:var(--canal); }

  .hub-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:1.25rem; }
  @media (max-width:900px){ .hub-grid{ grid-template-columns:repeat(2,1fr); } }
  @media (max-width:560px){ .hub-grid{ grid-template-columns:1fr; } }
  .hub-card{
    display:block; text-decoration:none; color:var(--ink);
    background:var(--paper-card); border:1px solid var(--rule); border-radius:8px;
    padding:1.5rem 1.4rem; transition:border-color .15s ease, transform .15s ease;
  }
  .hub-card:hover{ border-color:var(--radicchio); transform:translateY(-2px); }
  .hub-card .glyph{ font-family:"Piazzolla",serif; font-style:italic; font-size:1.7rem; color:var(--radicchio); }
  .hub-card h3{ font-size:1.05rem; margin-top:0.7rem; }
  .hub-card p{ font-size:0.86rem; color:var(--ink-soft); margin-top:0.4rem; }
  .hub-card .go{ display:inline-block; margin-top:0.9rem; font-family:"Space Mono",monospace; font-size:0.72rem; letter-spacing:0.04em; text-transform:uppercase; color:var(--canal); }

  /* ================= banners &amp; icons ================= */
  .page-banner{
    display:block; width:100%; height:auto;
    border:1px solid var(--rule); border-radius:8px; overflow:hidden;
    background:var(--paper-card);
  }
  .page-banner svg{ display:block; width:100%; height:auto; }
  .hero .page-banner{ margin-bottom:2rem; }
  .page-head .page-banner{ margin-top:1.75rem; }
  .region-card .icon{ width:42px; height:42px; margin-bottom:0.85rem; display:block; }

  /* ================= filter bar ================= */
  .filter-bar{ display:flex; gap:0.55rem; flex-wrap:wrap; margin-bottom:1.75rem; }
  .filter-bar button{
    font-family:"Space Mono", monospace; font-size:0.74rem; letter-spacing:0.02em;
    background:var(--paper-card); color:var(--ink-soft); border:1px solid var(--rule);
    padding:0.45rem 0.85rem; border-radius:99px; cursor:pointer;
  }
  .filter-bar button.active{ color:var(--plaster); background:var(--radicchio); border-color:var(--radicchio); }
  .filter-bar button:hover:not(.active){ border-color:var(--radicchio); color:var(--ink); }

  /* ================= events ================= */
  .events-list{ display:flex; flex-direction:column; gap:1rem; }
  .event-card{
    display:grid; grid-template-columns:5.5rem 1fr auto; gap:1.3rem; align-items:center;
    background:var(--paper-card); border:1px solid var(--rule); border-radius:8px; padding:1.1rem 1.3rem;
  }
  @media (max-width:680px){ .event-card{ grid-template-columns:4.2rem 1fr; } .event-card .event-tag-col{ grid-column:1 / -1; margin-top:0.6rem; } }
  .date-block{
    text-align:center; background:var(--plaster-raised); border:1px solid var(--rule); border-radius:6px;
    padding:0.55rem 0.3rem;
  }
  .date-block .mon{ font-family:"Space Mono",monospace; font-size:0.66rem; letter-spacing:0.06em; text-transform:uppercase; color:var(--radicchio); }
  .date-block .day{ font-family:"Piazzolla",serif; font-weight:700; font-size:1.5rem; line-height:1.1; }
  .event-card h3{ font-size:1.05rem; }
  .event-card .meta{ font-size:0.84rem; color:var(--ink-soft); margin-top:0.3rem; }
  .event-card .desc{ font-size:0.9rem; color:var(--ink-soft); margin-top:0.45rem; max-width:52ch; }

  /* ================= listing cards (stay / marketplace) ================= */
  .card-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:1.25rem; }
  @media (max-width:900px){ .card-grid{ grid-template-columns:repeat(2,1fr); } }
  @media (max-width:620px){ .card-grid{ grid-template-columns:1fr; } }
  .listing, .pending-card{
    background:var(--paper-card); border:1px solid var(--rule); border-radius:8px; padding:1.3rem 1.3rem 1.4rem;
    display:flex; flex-direction:column; gap:0.7rem;
  }
  .listing-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:0.75rem; }
  .listing h3, .pending-card h3{ font-size:1.02rem; line-height:1.3; }
  .price{ font-family:"Space Mono",monospace; font-weight:700; color:var(--radicchio); white-space:nowrap; font-size:0.95rem; }
  .listing .loc, .pending-card .loc{ font-size:0.82rem; color:var(--canal); }
  .listing .desc, .pending-card .desc{ font-size:0.88rem; color:var(--ink-soft); }
  .listing .amenities, .pending-card .amenities{ font-size:0.78rem; color:var(--ink-soft); border-top:1px dashed var(--rule); padding-top:0.6rem; margin-top:0.15rem; }
  .listing-foot{ display:flex; justify-content:space-between; align-items:center; margin-top:auto; padding-top:0.5rem; gap:0.75rem; flex-wrap:wrap; }
  .host{ font-size:0.78rem; color:var(--ink-soft); }

  /* ================= reviews ================= */
  .reviews-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:1.25rem; }
  @media (max-width:760px){ .reviews-grid{ grid-template-columns:1fr; } }
  .review{
    background:var(--paper-card); border:1px solid var(--rule); border-radius:8px; padding:1.4rem 1.4rem;
  }
  .review .stars{ color:var(--gold); font-size:0.95rem; letter-spacing:0.1em; }
  .review h3{ font-size:1.02rem; margin-top:0.55rem; }
  .review p.body{ font-size:0.92rem; color:var(--ink-soft); margin-top:0.55rem; }
  .review .byline{ font-family:"Space Mono",monospace; font-size:0.72rem; color:var(--ink-soft); margin-top:0.85rem; padding-top:0.7rem; border-top:1px dashed var(--rule); }
  .review .byline b{ color:var(--ink); font-weight:600; }

  /* ================= forms ================= */
  .form-card{
    background:var(--paper-card); border:1px solid var(--rule); border-radius:8px;
    padding:clamp(1.5rem,4vw,2.25rem); max-width:44rem;
    display:flex; flex-direction:column; gap:1.1rem;
  }
  .form-row{ display:grid; grid-template-columns:1fr 1fr; gap:1.1rem; }
  @media (max-width:560px){ .form-row{ grid-template-columns:1fr; } }
  .field-group{ display:flex; flex-direction:column; gap:0.4rem; }
  .field-group label{ font-family:"Space Mono",monospace; font-size:0.72rem; letter-spacing:0.03em; text-transform:uppercase; color:var(--ink-soft); }
  .field, select.field, textarea.field{
    font-family:"Public Sans", sans-serif;
    font-size:0.95rem;
    padding:0.7rem 0.85rem;
    border:1px solid var(--rule);
    background:var(--plaster-raised);
    color:var(--ink);
    border-radius:4px;
    width:100%;
  }
  textarea.field{ resize:vertical; min-height:5.5rem; font-family:"Public Sans",sans-serif; }
  .field::placeholder{ color:var(--ink-soft); }
  .form-actions{ display:flex; align-items:center; gap:1rem; }
  .btn{
    font-family:"Space Mono", monospace;
    font-size:0.82rem;
    letter-spacing:0.03em;
    background:var(--radicchio);
    color:var(--plaster);
    border:1px solid var(--radicchio);
    padding:0.75rem 1.3rem;
    border-radius:4px;
    cursor:pointer;
    transition:background 0.15s ease;
    white-space:nowrap;
  }
  .btn:hover:not(:disabled){ background:var(--radicchio-strong); }
  .btn:disabled{ opacity:0.55; cursor:default; }
  .btn.ghost{ background:transparent; color:var(--ink-soft); border-color:var(--rule); }
  .btn.ghost:hover:not(:disabled){ background:var(--plaster-raised); color:var(--ink); border-color:var(--ink-soft); }
  .btn.small{ padding:0.5rem 0.9rem; font-size:0.74rem; }
  .fineprint{ font-family:"Space Mono",monospace; font-size:0.72rem; color:var(--ink-soft); }

  .notice{
    border-radius:6px; padding:0.85rem 1rem; font-size:0.88rem; margin-bottom:1.25rem;
    border:1px solid var(--rule); background:var(--plaster-raised); color:var(--ink-soft);
  }
  .notice.success{ border-color:var(--status-open); color:var(--status-open); background:var(--canal-soft); }
  .notice.error{ border-color:var(--radicchio); color:var(--radicchio); }

  .muted-note{ color:var(--ink-soft); font-size:0.9rem; }

  footer{
    border-top:1px solid var(--rule);
    padding:2rem clamp(1.2rem,4vw,2.75rem) 2.5rem;
    max-width:1100px; margin:0 auto;
    display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:0.75rem;
  }
  footer .brandline{ font-family:"Piazzolla",serif; font-weight:600; }
  footer .note{ font-family:"Space Mono",monospace; font-size:0.7rem; color:var(--ink-soft); max-width:34ch; }
  footer .admin-link{ font-family:"Space Mono",monospace; font-size:0.7rem; color:var(--ink-soft); text-decoration:underline; margin-top:0.5rem; display:inline-block; }
</style>

<script>
(function(){
  var SCRIPT_SOURCE = document.currentScript.textContent;

  /*STATE_START*/
  var STATE = {
    marketplace: [
      { id:"m1", title:"Vintage Bianchi city bike", price:"140", category:"bikes", location:"Barriera Vittoria", desc:"1980s steel frame, recently serviced with new tyres and brake pads. Great for the flat towpaths.", condition:"Good", posted:"2 days ago", seller:"Luca", badgeText:"Available", badgeKind:"open" },
      { id:"m2", title:"Solid oak dining table", price:"220", category:"furniture", location:"San Zeno", desc:"Seats six comfortably, a few surface marks but structurally solid. Buyer collects.", condition:"Fair", posted:"5 days ago", seller:"Chiara", badgeText:"Available", badgeKind:"open" },
      { id:"m3", title:"Box of vinyl, Italian pop 70s–80s", price:"35", category:"other", location:"Centro storico", desc:"About forty records, mixed condition, mostly Italian radio hits. Sold as one box.", condition:"Mixed", posted:"1 week ago", seller:"Paolo", badgeText:"Sold", badgeKind:"taken" },
      { id:"m4", title:"Wooden radicchio crates (x4)", price:"15", category:"other", location:"Fuori Porta Altinia", desc:"Sturdy slatted crates from a local grower, good as-is for storage or planters.", condition:"Used", posted:"3 days ago", seller:"Giovanna", badgeText:"Available", badgeKind:"open" },
      { id:"m5", title:"Gaggia Classic espresso machine", price:"90", category:"electronics", location:"San Paolo", desc:"Works well, descaled last month. Selling because I upgraded, not because it's broken.", condition:"Good", posted:"yesterday", seller:"Matteo", badgeText:"Available", badgeKind:"open" },

    ],
    stay: [
      { id:"s1", title:"Studio on the Buranelli", price:"78", type:"apartment", location:"Historic centre · 4 min walk to Piazza dei Signori", desc:"A one-room apartment on the canal, with a small balcony over the water and a kitchenette.", amenities:"Canal view · wifi · washer · self check-in", host:"Elena R.", badgeText:"Available", badgeKind:"open" },
      { id:"s2", title:"Room in a Frescoed Townhouse", price:"48", type:"room", location:"Via Calmaggiore · shared bathroom", desc:"A quiet room in a 16th-century house with original ceiling frescoes in the hallway.", amenities:"Breakfast included · wifi · bike storage", host:"Marco B.", badgeText:"Available", badgeKind:"open" },
      { id:"s3", title:"Loft near Porta San Tomaso", price:"120", type:"apartment", location:"Inside the walls · 2 bedrooms", desc:"A converted mill loft with exposed beams, close to one of the old city gates.", amenities:"Sleeps 4 · kitchen · wifi · parking nearby", host:"Sofia &amp; Dario", badgeText:"Booked through Oct 2", badgeKind:"taken" },
      { id:"s4", title:"Countryside Casale, Prosecco Hills", price:"165", type:"villa", location:"Near Conegliano · vineyard views", desc:"A restored farmhouse among the Prosecco vineyards, with a shared pool and terrace dinners.", amenities:"Sleeps 6 · pool · garden · car recommended", host:"the Zanetti family", badgeText:"Available", badgeKind:"open" },
      { id:"s5", title:"Attic Room, Pescheria View", price:"55", type:"room", location:"Overlooking the fish market island", desc:"A small top-floor room with sloped ceilings and a window straight onto the canal and market.", amenities:"Wifi · shared kitchen · no lift", host:"Giulia T.", badgeText:"Available", badgeKind:"open" },
      { id:"s6", title:"Two-Bedroom near Sile Park", price:"95", type:"apartment", location:"Riverside · good for cyclists", desc:"Steps from the towpath into the Sile Regional Park, with secure bike storage in the courtyard.", amenities:"Sleeps 4 · bike storage · wifi · kitchen", host:"Andrea P.", badgeText:"Booked through Sep 30", badgeKind:"taken" }
    ],
    pendingMarketplace: [],
    pendingStay: []
  };
  /*STATE_END*/

  function escapeHtml(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c];
    });
  }

  /* ---------- decorative illustrations (procedural SVG, theme-aware via CSS vars) ---------- */
  function archPath(x, yBase, w, h){
    var r = w/2, yTop = yBase - h;
    return 'M'+x+','+yBase+' L'+x+','+(yTop+r)+' A'+r+','+r+' 0 0 1 '+(x+w)+','+(yTop+r)+' L'+(x+w)+','+yBase+' Z';
  }
  function starPoints(cx, cy, rOuter, rInner, n){
    var pts = [];
    for (var i = 0; i < n*2; i++){
      var r = i % 2 === 0 ? rOuter : rInner;
      var a = (Math.PI/n)*i - Math.PI/2;
      pts.push((cx+r*Math.cos(a)).toFixed(1)+','+(cy+r*Math.sin(a)).toFixed(1));
    }
    return pts.join(' ');
  }
  function wavyPath(y, amp, wavelen, width){
    var d = 'M0,'+y, x = 0, up = true;
    while (x < width){
      var x2 = Math.min(x+wavelen, width);
      d += ' Q'+(x+wavelen/2)+','+(up ? y-amp : y+amp)+' '+x2+','+y;
      x = x2; up = !up;
    }
    return d;
  }
  function leafCluster(cx, cy, scale, rib){
    var g = '<g transform="translate('+cx+','+cy+') scale('+scale+')">';
    [-18,0,18].forEach(function(rot,i){
      g += '<ellipse cx="0" cy="0" rx="26" ry="12" fill="var(--radicchio)" opacity="'+(0.55+i*0.15)+'" transform="rotate('+rot+')"/>';
    });
    if (rib) g += '<path d="M-24,0 Q0,-4 24,0" stroke="var(--gold)" stroke-width="1.4" fill="none" opacity="0.8"/>';
    return g + '</g>';

  document.getElementById('app').innerHTML = renderBody(STATE);

  /* ---------- routing ---------- */
  function route(){
    var hash = (location.hash || '#home').slice(1);
    var pages = document.querySelectorAll('.page');
    var found = false;
    pages.forEach(function(p){
      var match = p.id === hash;
      p.hidden = !match;
      if (match) found = true;
    });
    if (!found) { document.getElementById('home').hidden = false; hash = 'home'; }
    document.querySelectorAll('.nav-link').forEach(function(a){
      a.classList.toggle('active', a.getAttribute('href') === '#' + hash);
    });
    window.scrollTo(0,0);
  }
  window.addEventListener('hashchange', route);
  route();

  /* ---------- filters ---------- */
  document.querySelectorAll('.filter-bar').forEach(function(bar){
    bar.addEventListener('click', function(e){
      var btn = e.target.closest('button[data-filter]');
      if (!btn) return;
      var val = btn.dataset.filter;
      bar.querySelectorAll('button').forEach(function(b){ b.classList.toggle('active', b === btn); });
      var list = bar.parentElement.querySelector('.events-list, .card-grid');
      if (!list) return;
      list.querySelectorAll('[data-cat]').forEach(function(card){
        card.style.display = (val === 'all' || card.dataset.cat === val) ? '' : 'none';
      });
    });
  });

  /* ---------- success banner after a reload that followed a submission ---------- */
  try {
    var justSubmitted = sessionStorage.getItem('justSubmitted');
    if (justSubmitted) {
      sessionStorage.removeItem('justSubmitted');
      var target = justSubmitted === 'sell' ? document.getElementById('sell-notice') : document.getElementById('list-notice');
      if (target) target.innerHTML = '<div class="notice success">Thanks — your submission is in for review. It will appear once approved.</div>';
    }
  } catch (e) {}

  /* ---------- publishing (artifact capability) ---------- */
  function buildFullDocument(state){
    var json = JSON.stringify(state).replace(/</g, '\\u003c');
    var newScript = SCRIPT_SOURCE.replace(
      /\/\*STATE_START\*\/[\s\S]*?\/\*STATE_END\*\//,
      '/*STATE_START*/\n  var STATE = ' + json + ';\n  /*STATE_END*/'
    );
    var headLinks = Array.prototype.map.call(
      document.querySelectorAll('link[rel="preconnect"], link[rel="stylesheet"]'),
      function(l){ return l.outerHTML; }
    ).join('');
    var css = document.getElementById('page-style').textContent;
    var head = '<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">' +
      '<title>' + escapeHtml(document.title) + '</title>' + headLinks +
      '<style id="page-style">' + css + '</style>';
    return '<!doctype html><html><head>' + head + '</head><body><div id="app"></div><script>' + newScript + '<' + '/script></body></html>';
  }

  function showNotice(container, kind, msg){
    if (!container) return;
    container.innerHTML = '<div class="notice ' + kind + '">' + msg + '</div>';
  }

  function readOnlyMessage(){
    return 'This view is read-only here — ask the site owner to give you edit access so submissions and approvals can be saved.';
  }

  function publish(newState){
    if (!window.claude || !window.claude.use) return Promise.reject({ code: 'not_granted' });
    return window.claude.use('artifact').then(function(a){
      if (!a) { var err = new Error('artifact capability unavailable'); err.code = 'not_granted'; throw err; }
      return a.publish(buildFullDocument(newState));
    });
  }

  function cloneState(){ return JSON.parse(JSON.stringify(STATE)); }

  function wireForm(formId, noticeId, kind){
    var form = document.getElementById(formId);
    if (!form) return;
    var notice = document.getElementById(noticeId);
    form.addEventListener('submit', function(e){
      e.preventDefault();
      var btn = form.querySelector('button[type="submit"]');
      var fd = new FormData(form);
      var newState = cloneState();
      var id = (kind === 'sell' ? 'p' : 'a') + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
      var submittedAt = new Date().toISOString().slice(0,10);
      if (kind === 'sell') {
        newState.pendingMarketplace.push({
          id: id, title: fd.get('title'), price: fd.get('price'), category: fd.get('category'),
          condition: fd.get('condition'), location: fd.get('location'), desc: fd.get('desc'),
          sellerName: fd.get('sellerName'), contact: fd.get('contact'), submittedAt: submittedAt
        });
      } else {
        newState.pendingStay.push({
          id: id, title: fd.get('title'), price: fd.get('price'), type: fd.get('type'),
          location: fd.get('location'), desc: fd.get('desc'), amenities: fd.get('amenities'),
          hostName: fd.get('hostName'), contact: fd.get('contact'), submittedAt: submittedAt
        });
      }
      btn.disabled = true; btn.textContent = 'Submitting…';
      showNotice(notice, '', '');
      notice.innerHTML = '';
      try { sessionStorage.setItem('justSubmitted', kind); } catch (err) {}
      function attempt(retried){
        publish(newState).catch(function(err){
          var code = err && err.code;
          try { sessionStorage.removeItem('justSubmitted'); } catch (e2) {}
          if (code === 'not_writer' || code === 'not_granted' || code === 'consent_required' || code === 'not_declared' || code === 'capability_disabled') {
            btn.disabled = true;
            showNotice(notice, 'error', readOnlyMessage());
          } else if (code === 'conflict') {
            /* another version is already publishing in; the view reloads on its own */
          } else if (code === 'upstream_error' && !retried) {
            setTimeout(function(){ attempt(true); }, 800 + Math.random() * 700);
          } else {
            btn.disabled = false; btn.textContent = 'Submit for review';
            showNotice(notice, 'error', 'Something went wrong submitting this — please try again.');
          }
        });
      }
      attempt(false);
    });
  }
  wireForm('sell-form', 'sell-notice', 'sell');
  wireForm('list-form', 'list-notice', 'list');

  function wireAdmin(containerId, kind){
    var container = document.getElementById(containerId);
    if (!container) return;
    container.addEventListener('click', function(e){
      var btn = e.target.closest('button[data-action]');
      if (!btn) return;
      var id = btn.dataset.id;
      var action = btn.dataset.action;
      var pendKey = kind === 'marketplace' ? 'pendingMarketplace' : 'pendingStay';
      var liveKey = kind === 'marketplace' ? 'marketplace' : 'stay';
      var newState = cloneState();
      var idx = newState[pendKey].findIndex(function(x){ return x.id === id; });
      if (idx === -1) return;
      var entry = newState[pendKey].splice(idx, 1)[0];
      if (action === 'approve') {
        entry.badgeText = 'Available';
        entry.badgeKind = 'open';
        if (kind === 'marketplace') entry.posted = 'today';
        newState[liveKey].push(entry);
      }
      var card = btn.closest('.pending-card');
      var buttons = card.querySelectorAll('button');
      buttons.forEach(function(b){ b.disabled = true; });
      var adminNotice = document.getElementById('admin-notice');
      publish(newState).catch(function(err){
        var code = err && err.code;
        buttons.forEach(function(b){ b.disabled = false; });
        if (code === 'not_writer' || code === 'not_granted' || code === 'consent_required' || code === 'not_declared' || code === 'capability_disabled') {
          showNotice(adminNotice, 'error', readOnlyMessage());
        } else if (code === 'conflict') {
          /* view reloads to the winning version on its own */
        } else {
          showNotice(adminNotice, 'error', 'Something went wrong saving that — please try again.');
        }
      });
    });
  }
  wireAdmin('admin-marketplace', 'marketplace');
  wireAdmin('admin-stay', 'stay');
})();
